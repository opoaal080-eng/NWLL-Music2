plugins { id 'com.android.application' }
android {
    namespace 'fun.nightwell.music'
    compileSdk 35
    defaultConfig {
        applicationId 'fun.nightwell.music'
        minSdk 26
        targetSdk 35
        versionCode 37
        versionName '1.1.6-autumn'
        // Direct APK builds enable website checkout. Disable for store builds until regional routing is configured.
        buildConfigField 'boolean', 'EXTERNAL_PREMIUM_PAYMENTS', providers.gradleProperty('nightwellExternalPayments').getOrElse('true') == 'true' ? 'true' : 'false'
    }
    signingConfigs {
        debug {
          if (file('../../Nightwell-Music-Android-debug.keystore').exists()) {
            storeFile file('../../Nightwell-Music-Android-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
          }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.6.1'
    implementation 'androidx.media3:media3-session:1.6.1'
}

