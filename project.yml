name: NightwellMusic
options:
  bundleIdPrefix: fun.nightwell
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  NightwellMusic:
    type: application
    platform: iOS
    sources:
      - path: NightwellMusic
    info:
      path: NightwellMusic/Info.plist
      properties:
        CFBundleDisplayName: Nightwell Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NWSourceCommit: SOURCE_COMMIT
        NWExternalPremiumPayments: true
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: fun.nightwell.music
            CFBundleURLSchemes: [nightwell]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: NightwellMusic/NightwellMusic.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.nightwell.music
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "97"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Nightwell Music
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NightwellMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NativeTests]
    dependencies:
      - target: NightwellMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.nightwell.music.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NightwellMusic:
    build:
      targets:
        NightwellMusic: all
    test:
      targets: [NightwellMusicTests]
