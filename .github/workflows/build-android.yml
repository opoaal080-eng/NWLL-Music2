name: Build Nightwell Music Android (Recovered)
on:
  workflow_dispatch:
  push:
    branches: [main, nw-player-redesign-20261027]
    paths:
      - 'android/**'
      - 'scripts/validate-app-sources.py'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Generate monochrome launcher icons
        run: python3 generate-monochrome-icons.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK command line tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Validate Android resources
        run: python3 ../scripts/validate-app-sources.py --android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test Ambient Flow audio response
        run: |
          javac -d /tmp/ambient-flow-test app/src/main/java/fun/nightwell/music/AmbientFlowState.java tests/AmbientFlowStateTest.java
          java -cp /tmp/ambient-flow-test fun.nightwell.music.AmbientFlowStateTest
      - name: Test playlist file decoding
        run: |
          javac -d /tmp/playlist-import-test app/src/main/java/fun/nightwell/music/PlaylistImportFile.java tests/PlaylistImportFileTest.java
          java -cp /tmp/playlist-import-test fun.nightwell.music.PlaylistImportFileTest
      - name: Test playlist parsing on device
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Record APK checksum and commit
        run: python3 ../scripts/build-provenance.py --platform android --directory app/build/outputs/apk/debug --output ../android-build-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-Android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android-build-provenance.json

      - name: Install screenshot validation dependency
        run: python3 -m pip install Pillow
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check menu and document picker
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: android
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 check-playlist-import.py
            python3 check-native-layout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nightwell-Android-import-menu-checks
          path: |
            android/import-menu-checks
            android/native-smoke

  google-play-bundle:
    name: Google Play AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Generate monochrome launcher icons
        run: python3 generate-monochrome-icons.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Restore upload signing key when configured
        env:
          NIGHTWELL_KEYSTORE_BASE64: ${{ secrets.NIGHTWELL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NIGHTWELL_KEYSTORE_BASE64" ]; then
            printf '%s' "$NIGHTWELL_KEYSTORE_BASE64" | base64 -d > app/nightwell-upload.jks
            echo "RELEASE_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "::warning::No upload key configured; AAB will be unsigned and cannot be uploaded to Play Console."
          fi
      - name: Build Google Play release bundle
        env:
          NIGHTWELL_KEYSTORE_PASSWORD: ${{ secrets.NIGHTWELL_KEYSTORE_PASSWORD }}
          NIGHTWELL_KEY_PASSWORD: ${{ secrets.NIGHTWELL_KEY_PASSWORD }}
          NIGHTWELL_KEY_ALIAS: ${{ secrets.NIGHTWELL_KEY_ALIAS }}
        run: gradle --no-daemon :app:bundleRelease -PnightwellExternalPayments=false
      - name: Verify bundle signature
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7


