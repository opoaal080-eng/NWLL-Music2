name: Build Nightwell Music Android (Recovered)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/validate-app-sources.py'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK command line tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Validate Android resources
        run: python3 ../scripts/validate-app-sources.py --android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test playlist file decoding
        run: |
          javac -d /tmp/playlist-import-test app/src/main/java/fun/nightwell/music/PlaylistImportFile.java tests/PlaylistImportFileTest.java
          java -cp /tmp/playlist-import-test fun.nightwell.music.PlaylistImportFileTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Record APK checksum and commit
        run: python3 ../scripts/build-provenance.py --platform android --directory app/build/outputs/apk/debug --output ../android-build-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-Android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android-build-provenance.json

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check menu and document picker
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: android
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 check-playlist-import.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nightwell-Android-import-menu-checks
          path: android/import-menu-checks
