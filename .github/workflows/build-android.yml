name: Build Nightwell Music Android (Recovered)
on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/windows-mobile-parity-20261106 , feature/search-glow-android-suggestions-ios-20261112]
    paths:
      - 'android/**'
      - 'scripts/validate-app-sources.py'
      - '.github/workflows/build-android.yml'
  push:
    branches: [main, feature/windows-mobile-parity-20261106, feature/android-ios-scroll-parity-20261111, fix/clip-unlimited-device-cache-20261111, feature/android-ios-interface-parity-20261111, fix/android-ios-visual-parity-player-20261111, fix/android-covers-all-libraries-20261112, feature/android-responsive-player-cover-theme-20261112, feature/search-glow-android-suggestions-ios-20261112, fix/ios-search-transfer-regressions-20261112]
    paths:
      - 'android/**'
      - 'scripts/validate-app-sources.py'
      - 'scripts/make-neutral-app-icon.py'
      - '.github/workflows/build-android.yml'
concurrency:
  # Old PR checks must not consume emulator/macOS runners after source updates.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK command line tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Generate neutral launcher icons
        run: python3 ../scripts/make-neutral-app-icon.py --platform android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify non-destructive queue behavior (JVM)
        run: |
          mkdir -p build/queue-tests
          javac -d build/queue-tests \
            app/src/main/java/fun/nightwell/music/ManualPlaybackQueue.java \
            tests/ManualPlaybackQueueTest.java
          java -cp build/queue-tests fun.nightwell.music.ManualPlaybackQueueTest
      - name: Record APK checksum and commit
        run: python3 ../scripts/build-provenance.py --platform android --directory app/build/outputs/apk/debug --output ../android-build-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-Android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android-build-provenance.json

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Restore upload signing key when configured
        env:
          NIGHTWELL_KEYSTORE_BASE64: ${{ secrets.NIGHTWELL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NIGHTWELL_KEYSTORE_BASE64" ]; then
            printf '%s' "$NIGHTWELL_KEYSTORE_BASE64" | base64 -d > app/nightwell-upload.jks
            echo "RELEASE_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "::warning::No upload key configured; AAB will be unsigned and cannot be uploaded to Play Console."
          fi
      - name: Generate neutral launcher icons
        run: python3 ../scripts/make-neutral-app-icon.py --platform android
      - name: Build Google Play release bundle
        env:
          NIGHTWELL_KEYSTORE_PASSWORD: ${{ secrets.NIGHTWELL_KEYSTORE_PASSWORD }}
          NIGHTWELL_KEY_PASSWORD: ${{ secrets.NIGHTWELL_KEY_PASSWORD }}
          NIGHTWELL_KEY_ALIAS: ${{ secrets.NIGHTWELL_KEY_ALIAS }}
        run: gradle --no-daemon :app:bundleRelease -PnightwellExternalPayments=false
      - name: Verify bundle signature
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

  emulator-screenshots:
    name: Emulator UI screenshots (Pixel 6, API 35)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download installable debug APK
        uses: actions/download-artifact@v4
        with:
          name: Nightwell-Music-Android-debug
          path: android/native-smoke/apk
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start emulator and capture actual UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          script: |
            adb install -r android/native-smoke/apk/app-debug.apk
            python3 android/capture-emulator-screens.py
      - name: Publish emulator screenshots and HTML gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-Android-emulator-screenshots
          path: android/native-smoke/screenshots/
          if-no-files-found: warn
          retention-days: 14
