name: Verify iOS widget server pairing
on:
  push:
    branches: [main, fix/ios-latest-account-family-20261116]
    paths:
      - 'server-updates/widget-sync/**'
      - '.github/workflows/test-widget-sync.yml'
  pull_request:
    paths:
      - 'server-updates/widget-sync/**'
      - '.github/workflows/test-widget-sync.yml'
jobs:
  widgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - name: Verify pairing, permissions and artwork
        run: python -m unittest discover -v -s server-updates/widget-sync -p 'test*.py'
      - name: Package Windows server update
        run: |
          mkdir -p dist/Nightwell-Widget-Server
          cp server-updates/widget-sync/widget_sync.py dist/Nightwell-Widget-Server/
          cp server-updates/widget-sync/install_widget_sync.py dist/Nightwell-Widget-Server/
          cp server-updates/widget-sync/README-RU.md dist/Nightwell-Widget-Server/
          cp server-updates/widget-sync/*.bat dist/Nightwell-Widget-Server/
          cd dist
          zip -qr Nightwell-Widget-Server-Update.zip Nightwell-Widget-Server
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Widget-Server-Update
          path: dist/Nightwell-Widget-Server-Update.zip
