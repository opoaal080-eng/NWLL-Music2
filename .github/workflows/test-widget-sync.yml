name: Verify iOS widget server pairing
on:
  push:
    branches: [main, fix/ios-latest-account-family-20261116]
    paths:
      - 'server-updates/widget-sync/**'
      - '.github/workflows/test-widget-sync.yml'
  pull_request:
    paths:
      - 'server-updates/widget-sync/**'
      - '.github/workflows/test-widget-sync.yml'
jobs:
  widgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - name: Verify pairing, permissions and artwork
        run: python -m unittest discover -v -s server-updates/widget-sync -p 'test*.py'
