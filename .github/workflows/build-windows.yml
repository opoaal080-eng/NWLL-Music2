name: Build Nightwell Music Windows (Recovered)
on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/windows-mobile-parity-20261106]
    paths:
      - 'windows/**'
      - 'scripts/validate-app-sources.py'
      - 'scripts/build-provenance.py'
      - '.github/workflows/build-windows.yml'
  push:
    branches: [main, feature/windows-mobile-parity-20261106]
    paths:
      - 'windows/**'
      - 'scripts/validate-app-sources.py'
      - 'scripts/build-provenance.py'
      - '.github/workflows/build-windows.yml'
concurrency:
  # Old PR checks must not consume emulator/macOS runners after source updates.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows XAML
        run: python scripts/validate-app-sources.py --windows
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows app
        run: dotnet publish windows/Nightwell.Native.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Check window startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "publish\Nightwell Music.exe" -ArgumentList "--native-smoke" -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw "Window did not respond within 30 seconds" }
          if ($process.ExitCode -ne 0) { throw "Startup failed" }
          if (!(Test-Path "windows-native-smoke.png")) { throw "Window screenshot missing" }
      - name: Render all dark theme states
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "publish\Nightwell Music.exe" -ArgumentList "--design-preview" -PassThru
          if (!$process.WaitForExit(45000)) { $process.Kill(); throw "Design preview did not finish" }
          if ($process.ExitCode -ne 0) { if (Test-Path "ui-preview-error.txt") { Get-Content "ui-preview-error.txt" }; throw "Design preview failed" }
          if (!(Test-Path "ui-previews\11-login.png")) { throw "Incomplete design previews" }
          Copy-Item "windows\logo.png" "ui-previews\brand-logo.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-UI-preview
          path: |
            windows-native-smoke.png
            ui-previews/**
            ui-preview-error.txt
      - name: Build Windows installer (Inno Setup)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found" }
          & $compiler "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          if (!(Test-Path "setup-output\Nightwell-Music-Setup-1.3.5.exe")) { throw "Installer not produced" }
      - name: Record EXE checksum and commit
        run: python scripts/build-provenance.py --platform windows --directory publish --output publish/build-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-Windows
          path: publish/**
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Nightwell-Music-Windows-Installer
          path: setup-output/Nightwell-Music-Setup-1.3.5.exe

