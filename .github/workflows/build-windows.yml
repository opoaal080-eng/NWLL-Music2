name: Build Nightwell Music Windows (Recovered)
on:
  workflow_dispatch:
  push:
    branches: [main, feature/workspace-profile-20261108]
    paths:
      - 'windows/**'
      - 'scripts/validate-app-sources.py'
      - 'scripts/build-provenance.py'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows XAML
        run: python scripts/validate-app-sources.py --windows
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows app
        run: dotnet publish windows/Nightwell.Native.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Test queue ordering
        run: dotnet run --project windows-tests/QueueTests.csproj -c Release
      - name: Capture and validate desktop workspace
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "publish/Nightwell Music.exe" -ArgumentList "--design-preview" -PassThru
          if (!$app.WaitForExit(60000)) { $app.Kill(); throw "UI preview timed out" }
          if ($app.ExitCode -ne 0) { Get-Content ui-preview-error.txt -ErrorAction SilentlyContinue; throw "UI preview failed" }
          if (!(Test-Path "ui-previews/checks.json")) { throw "Missing UI validation" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nightwell-Workspace-Previews
          path: |
            ui-previews/**
            ui-preview-error.txt
      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found" }
          & $compiler "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          if (!(Test-Path "setup-output\Nightwell-Music-Setup-1.4.0.exe")) { throw "Installer not produced" }
      - name: Record EXE checksum and commit
        run: python scripts/build-provenance.py --platform windows --directory publish --output publish/build-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-Windows
          path: publish/**
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-Windows-Installer
          path: setup-output/Nightwell-Music-Setup-1.4.0.exe
