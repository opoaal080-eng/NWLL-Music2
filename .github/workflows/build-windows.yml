name: Build Nightwell Music Windows (Recovered)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'scripts/validate-app-sources.py'
      - 'scripts/build-provenance.py'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare independently animated Vice Nights palms
        run: |
          python -m pip install --quiet numpy opencv-python-headless
          python scripts/prepare-vice-palms.py --platform windows
      - name: Validate Windows XAML
        run: python scripts/validate-app-sources.py --windows
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows app
        run: dotnet publish windows/Nightwell.Native.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Render UI smoke previews
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish\Nightwell Music.exe'
          if (!(Test-Path $exe)) { throw 'Published executable not found' }
          $p = Start-Process -FilePath $exe -ArgumentList '--design-preview' -PassThru -WorkingDirectory $PWD
          if (!$p.WaitForExit(90000)) { $p.Kill(); throw 'UI preview timed out' }
          if ($p.ExitCode -ne 0) {
            if (Test-Path 'ui-preview-error.txt') { Get-Content 'ui-preview-error.txt' }
            throw "UI preview exited with $($p.ExitCode)"
          }
          if (!(Test-Path 'ui-previews/checks.json')) { throw 'UI preview result missing' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nightwell-Music-Windows-UI-Previews
          path: |
            ui-previews/**
            ui-preview-error.txt
      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found" }
          & $compiler "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          if (!(Test-Path "setup-output\Nightwell-Music-Setup-1.3.3.exe")) { throw "Installer not produced" }
      - name: Record EXE checksum and commit
        run: python scripts/build-provenance.py --platform windows --directory publish --output publish/build-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-Windows
          path: publish/**
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-Windows-Installer
          path: setup-output/Nightwell-Music-Setup-1.3.3.exe
