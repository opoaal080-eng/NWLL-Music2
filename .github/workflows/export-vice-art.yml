name: Export Vice Artwork For Animation
on:
  push:
    branches:
      - feature/windows-vice-sunset-android-parity-20261118
    paths:
      - '.github/workflows/export-vice-art.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Vice-Sunset-Original-HighRes
          path: windows/vice_sunset.jpg
          if-no-files-found: error
