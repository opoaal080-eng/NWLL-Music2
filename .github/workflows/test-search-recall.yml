name: Test server search recall
on:
  push:
    paths:
      - 'server-updates/search-recall/**'
      - 'server-updates/audius/**'
      - 'server-updates/adaptive-wave/**'
      - '.github/workflows/test-search-recall.yml'
  pull_request:
    paths:
      - 'server-updates/search-recall/**'
      - 'server-updates/audius/**'
      - 'server-updates/adaptive-wave/**'
      - '.github/workflows/test-search-recall.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test provider retrieval, ranking and server patch installer
        run: python -m unittest discover -s server-updates/search-recall -p 'test_*.py' -v
      - name: Install API test dependencies
        run: python -m pip install fastapi httpx
      - name: Test late Audius wrapper and adaptive wave source priority
        run: |
          python -m unittest discover -s server-updates/audius -p 'test_*.py' -v
          python -m unittest discover -s server-updates/adaptive-wave -p 'test_*.py' -v
