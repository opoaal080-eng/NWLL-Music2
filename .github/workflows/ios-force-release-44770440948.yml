name: Force release previous iOS runner
on:
  push:
    branches: [fix/ios-latest-account-family-20261116]
    paths: ['.github/workflows/ios-force-release-44770440948.yml']
permissions:
  contents: read
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force cancel only stuck superseded run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          id=44770440948
          state="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .status)"
          echo "Earlier run status: $state"
          if [ "$state" != completed ]; then
            gh api -X POST "repos/$GH_REPO/actions/runs/$id/force-cancel"
            echo "Force cancellation requested"
          fi
