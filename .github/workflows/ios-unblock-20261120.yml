name: Unblock stale iOS build 44676487178
on:
  push:
    branches: [fix/ios-latest-account-family-20261116]
    paths: ['.github/workflows/ios-unblock-20261120.yml']
permissions:
  contents: read
  actions: write
jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only the stale iOS workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=44676487178
          status="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq .status)"
          echo "Stale build status: $status"
          if [ "$status" = "completed" ]; then
            echo "No cancellation required"
            exit 0
          fi
          gh api -X POST "repos/$GH_REPO/actions/runs/$run_id/cancel"
          echo "Cancellation requested for run $run_id"
