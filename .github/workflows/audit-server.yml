name: Server module audit regression tests
on:
  pull_request:
    branches: [main, feature/windows-mobile-parity-20261106]
    paths:
      - 'server/lava_webhook.py'
      - 'server-updates/audio-quality/**'
      - 'server-updates/playlist-transfer/**'
      - 'scripts/test-server-audit.py'
      - '.github/workflows/audit-server.yml'
  push:
    branches: [main, feature/windows-mobile-parity-20261106]
    paths:
      - 'server/lava_webhook.py'
      - 'server-updates/audio-quality/**'
      - 'server-updates/playlist-transfer/**'
      - 'scripts/test-server-audit.py'
      - '.github/workflows/audit-server.yml'
  workflow_dispatch:
concurrency:
  # Old PR checks must not consume emulator/macOS runners after source updates.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  server-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install narrow test dependencies
        run: python -m pip install fastapi httpx
      - name: Compile server modules
        run: |
          python -m py_compile server/lava_webhook.py
          python -m py_compile server-updates/audio-quality/audio_quality.py
          python -m py_compile server-updates/playlist-transfer/music_import.py
      - name: Test concurrent quality lookups and webhook persistence
        run: python scripts/test-server-audit.py
