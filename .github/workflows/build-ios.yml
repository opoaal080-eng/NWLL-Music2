name: Build Nightwell Music iOS (Recovered)
on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/windows-mobile-parity-20261106, fix/ios-clip-cache-retry-20261111, fix/clip-unlimited-device-cache-20261111 , feature/search-glow-android-suggestions-ios-20261112]
    paths:
      - 'NightwellMusic/**'
      - 'source/NightwellMusic/**'
      - 'NativeTests/**'
      - 'project.yml'
      - 'scripts/verify-native-source.py'
      - 'scripts/test-*.swift'
      - 'scripts/fixtures/**'
      - 'scripts/make-neutral-app-icon.py'
      - '.github/workflows/build-ios.yml'
  push:
    branches: [main, feature/windows-mobile-parity-20261106, fix/ios-clip-cache-retry-20261111, fix/clip-unlimited-device-cache-20261111, feature/search-glow-android-suggestions-ios-20261112, fix/ios-search-transfer-regressions-20261112, feature/account-devices-2-free-5-premium-20261114]
    paths:
      - 'NightwellMusic/**'
      - 'source/NightwellMusic/**'
      - 'NativeTests/**'
      - 'project.yml'
      - 'scripts/verify-native-source.py'
      - 'scripts/test-*.swift'
      - 'scripts/fixtures/**'
      - 'scripts/make-neutral-app-icon.py'
      - '.github/workflows/build-ios.yml'
concurrency:
  # Old PR checks must not consume emulator/macOS runners after source updates.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  ios:
    # Use the current Intel image that successfully provisions for this account.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select latest installed Xcode
        run: |
          python3 - <<'PYCODE'
          import glob, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              developer = app + '/Contents/Developer'
              result = subprocess.run(['env', 'DEVELOPER_DIR=' + developer, 'xcodebuild', '-version'], capture_output=True, text=True)
              if result.returncode == 0:
                  version = tuple(int(x) for x in result.stdout.splitlines()[0].split()[1].split('.'))
                  candidates.append((version, developer))
          version, developer = max(candidates)
          subprocess.run(['sudo', 'xcode-select', '-s', developer], check=True)
          print('Selected Xcode', version)
          PYCODE
      - name: Generate neutral app icon
        run: python3 scripts/make-neutral-app-icon.py --platform ios
      - name: Generate project
        run: |
          sed -i '' "s/SOURCE_COMMIT/$GITHUB_SHA/" project.yml
          xcodegen generate
      - name: Build unsigned IPA
        run: |
          xcodebuild -project NightwellMusic.xcodeproj -scheme NightwellMusic -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CURRENT_PROJECT_VERSION=$((400 + GITHUB_RUN_NUMBER)) CODE_SIGNING_ALLOWED=NO build
          test -s build-device/Build/Products/Release-iphoneos/NightwellMusic.app/Assets.car
          # Never restore old compiled assets: they carry the Halloween launcher icon.
          test -s NightwellMusic/Assets.xcassets/AppIcon.appiconset/Icon.png
          mkdir -p output/Payload
          cp -R build-device/Build/Products/Release-iphoneos/NightwellMusic.app output/Payload/
          cd output
          zip -qr Nightwell-Music-recovered-unsigned.ipa Payload
      - name: Record IPA checksum and commit
        run: python3 scripts/build-provenance.py --platform ios --directory output --output output/build-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-iOS-unsigned
          path: |
            output/Nightwell-Music-recovered-unsigned.ipa
            output/build-provenance.json

  presentation-regression:
    name: Artist and search regression
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select latest installed Xcode
        run: |
          python3 - <<'PYCODE'
          import glob, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              developer = app + '/Contents/Developer'
              result = subprocess.run(['env', 'DEVELOPER_DIR=' + developer, 'xcodebuild', '-version'], capture_output=True, text=True)
              if result.returncode == 0:
                  version = tuple(int(x) for x in result.stdout.splitlines()[0].split()[1].split('.'))
                  candidates.append((version, developer))
          version, developer = max(candidates)
          subprocess.run(['sudo', 'xcode-select', '-s', developer], check=True)
          PYCODE
      - name: Generate project
        run: xcodegen generate
      - name: Open artist profile and collapse search
        run: |
          NIGHTWELL_SIMULATOR_ID="$(python3 - <<'PYCODE'
          import json, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          phones = [device for group in devices['devices'].values() for device in group if 'iPhone' in device['name']]
          print(phones[0]['udid'])
          PYCODE
          )"
          xcodebuild -project NightwellMusic.xcodeproj -scheme NightwellMusic -configuration Debug -destination "platform=iOS Simulator,id=$NIGHTWELL_SIMULATOR_ID" -derivedDataPath build-presentation -resultBundlePath artist-presentation.xcresult -only-testing:NightwellMusicTests/ArtistProfilePresentationTests -only-testing:NightwellMusicTests/SearchPresentationTests -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iOS-presentation-regression-results
          path: artist-presentation.xcresult
          if-no-files-found: ignore
