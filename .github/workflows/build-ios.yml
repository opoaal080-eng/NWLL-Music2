name: Build Nightwell Music iOS (Recovered)
on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/windows-mobile-parity-20261106, fix/ios-clip-cache-retry-20261111, fix/clip-unlimited-device-cache-20261111 , feature/search-glow-android-suggestions-ios-20261112]
    paths:
      - 'NightwellMusic/**'
      - 'source/NightwellMusic/**'
      - 'NativeTests/**'
      - 'project.yml'
      - 'scripts/verify-native-source.py'
      - 'scripts/test-*.swift'
      - 'scripts/fixtures/**'
      - 'scripts/make-neutral-app-icon.py'
      - '.github/workflows/build-ios.yml'
  push:
    branches: [main, feature/windows-mobile-parity-20261106, fix/ios-clip-cache-retry-20261111, fix/clip-unlimited-device-cache-20261111, feature/search-glow-android-suggestions-ios-20261112]
    paths:
      - 'NightwellMusic/**'
      - 'source/NightwellMusic/**'
      - 'NativeTests/**'
      - 'project.yml'
      - 'scripts/verify-native-source.py'
      - 'scripts/test-*.swift'
      - 'scripts/fixtures/**'
      - 'scripts/make-neutral-app-icon.py'
      - '.github/workflows/build-ios.yml'
concurrency:
  # Old PR checks must not consume emulator/macOS runners after source updates.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  ios:
    # Use the current Intel image that successfully provisions for this account.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovered sources
        run: python3 scripts/verify-native-source.py
      - name: Verify mirrored iOS sources
        run: |
          cmp NightwellMusic/MusicStore.swift source/NightwellMusic/MusicStore.swift
      - name: Parse Swift sources
        run: |
          swiftc -frontend -parse NightwellMusic/*.swift NativeTests/*.swift
          swiftc -frontend -parse source/NightwellMusic/*.swift
      - name: Test music search and recommendation controls
        run: |
          swiftc NightwellMusic/TransferSimilarity.swift NightwellMusic/NightwellSearch.swift NightwellMusic/RecommendationOrder.swift NightwellMusic/SkipFeedback.swift scripts/test-recommendations.swift -o /tmp/test-nightwell-recommendations
          /tmp/test-nightwell-recommendations
      - name: Test SoundCloud priority in generated mixes
        run: |
          swiftc NightwellMusic/TransferSimilarity.swift NightwellMusic/NightwellSearch.swift NightwellMusic/RecommendationOrder.swift NightwellMusic/NightwellSeededRhythm.swift scripts/test-source-recommendations.swift -o /tmp/test-source-recommendations
          /tmp/test-source-recommendations
      - name: Test remote uploader and performer attribution
        run: |
          swiftc NightwellMusic/ArtistAttribution.swift scripts/test-artist-attribution.swift -o /tmp/test-artist-attribution
          /tmp/test-artist-attribution
      - name: Test Premium payment confirmation
        run: |
          swiftc NightwellMusic/PremiumPaymentPolicy.swift scripts/test-premium-payment.swift -o /tmp/test-premium-payment
          /tmp/test-premium-payment
      - name: Test progressive library loading
        run: |
          swiftc NightwellMusic/LibraryRefreshCoordinator.swift scripts/test-library-refresh.swift -o /tmp/test-library-refresh
          /tmp/test-library-refresh
      - name: Test aura preparation
        run: |
          swiftc NightwellMusic/AuraPreparationPolicy.swift scripts/test-aura-preparation.swift -o /tmp/test-aura-preparation
          /tmp/test-aura-preparation
      - name: Test request retry safety
        run: |
          swiftc NightwellMusic/RequestRetry.swift scripts/test-request-retry.swift -o /tmp/test-request-retry
          /tmp/test-request-retry
      - name: Test playlist parsing on device
        run: |
          swiftc NightwellMusic/TransferSimilarity.swift NightwellMusic/TransferPreparation.swift scripts/test-transfer-preparation.swift -o /tmp/test-transfer-preparation
          /tmp/test-transfer-preparation
      - name: Test on-device transfer matching
        run: |
          swiftc NightwellMusic/TransferSimilarity.swift NightwellMusic/TransferPreparation.swift NightwellMusic/DeviceTransferMatcher.swift scripts/test-device-transfer-match.swift -o /tmp/test-device-transfer-match
          /tmp/test-device-transfer-match
      - name: Test search recall and trained transfer model
        run: |
          swiftc -O NightwellMusic/TransferSimilarity.swift NightwellMusic/NightwellSearch.swift scripts/test-search-recall.swift -o /tmp/test-search-recall
          /tmp/test-search-recall
          transfer=(NightwellMusic/TransferSimilarity.swift NightwellMusic/TransferPreparation.swift NightwellMusic/DeviceTransferMatcher.swift NightwellMusic/DeviceNeuralTransferMatcher.swift NightwellMusic/TransferNeuralModel.swift NightwellMusic/TransferRemoteSearch.swift)
          swiftc -O "${transfer[@]}" scripts/test-transfer-recall.swift -o /tmp/test-transfer-recall
          /tmp/test-transfer-recall
          swiftc -O "${transfer[@]}" scripts/test-transfer-search.swift -o /tmp/test-transfer-search
          /tmp/test-transfer-search
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select latest installed Xcode
        run: |
          python3 - <<'PYCODE'
          import glob, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              developer = app + '/Contents/Developer'
              result = subprocess.run(['env', 'DEVELOPER_DIR=' + developer, 'xcodebuild', '-version'], capture_output=True, text=True)
              if result.returncode == 0:
                  version = tuple(int(x) for x in result.stdout.splitlines()[0].split()[1].split('.'))
                  candidates.append((version, developer))
          version, developer = max(candidates)
          subprocess.run(['sudo', 'xcode-select', '-s', developer], check=True)
          print('Selected Xcode', version)
          PYCODE
      - name: Generate neutral app icon
        run: python3 scripts/make-neutral-app-icon.py --platform ios
      - name: Generate project
        run: |
          sed -i '' "s/SOURCE_COMMIT/$GITHUB_SHA/" project.yml
          xcodegen generate
      - name: Build unsigned IPA
        run: |
          xcodebuild -project NightwellMusic.xcodeproj -scheme NightwellMusic -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CURRENT_PROJECT_VERSION=$((400 + GITHUB_RUN_NUMBER)) CODE_SIGNING_ALLOWED=NO build
          test -s build-device/Build/Products/Release-iphoneos/NightwellMusic.app/Assets.car
          # Never restore old compiled assets: they carry the Halloween launcher icon.
          test -s NightwellMusic/Assets.xcassets/AppIcon.appiconset/Icon.png
          mkdir -p output/Payload
          cp -R build-device/Build/Products/Release-iphoneos/NightwellMusic.app output/Payload/
          cd output
          zip -qr Nightwell-Music-recovered-unsigned.ipa Payload
      - name: Record IPA checksum and commit
        run: python3 scripts/build-provenance.py --platform ios --directory output --output output/build-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-iOS-unsigned
          path: |
            output/Nightwell-Music-recovered-unsigned.ipa
            output/build-provenance.json
