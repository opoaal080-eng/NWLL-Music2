name: Build Nightwell Music iOS (Recovered)
on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/windows-mobile-parity-20261106, fix/ios-clip-cache-retry-20261111, fix/clip-unlimited-device-cache-20261111 , feature/search-glow-android-suggestions-ios-20261112, fix/ios-latest-account-family-20261116, fix/ios-foreground-island-20261121, fix/ios-ui-stalls-20261121]
    paths:
      - 'NightwellMusic/**'
      - 'NightwellWidgets/**'
      - 'NightwellWidgetShared/**'
      - 'source/NightwellMusic/**'
      - 'NativeTests/**'
      - 'project.yml'
      - 'scripts/verify-native-source.py'
      - 'scripts/test-*.swift'
      - 'scripts/fixtures/**'
      - 'scripts/make-neutral-app-icon.py'
      - 'scripts/prepare-vice-palms.py'
      - '.github/workflows/build-ios.yml'
  push:
    branches: [fix/ios-swipe-reversal-20261122, main, feature/windows-mobile-parity-20261106, fix/ios-clip-cache-retry-20261111, fix/clip-unlimited-device-cache-20261111, feature/search-glow-android-suggestions-ios-20261112, fix/ios-search-transfer-regressions-20261112, feature/account-devices-2-free-5-premium-20261114, fix/ios-latest-account-family-20261116]
    paths:
      - 'NightwellMusic/**'
      - 'NightwellWidgets/**'
      - 'NightwellWidgetShared/**'
      - 'source/NightwellMusic/**'
      - 'NativeTests/**'
      - 'project.yml'
      - 'scripts/verify-native-source.py'
      - 'scripts/test-*.swift'
      - 'scripts/fixtures/**'
      - 'scripts/make-neutral-app-icon.py'
      - 'scripts/prepare-vice-palms.py'
      - '.github/workflows/build-ios.yml'
concurrency:
  # Isolate the current iOS 27 build queue from a superseded macOS job
  # whose cancellation remains stuck in GitHub's previous group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-ios27-nowplaying-primary
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  ios:
    # The new NowPlaying MediaSession API requires the iOS 27 SDK.
    # Xcode 27 is available on the dedicated arm64 hosted runner, not on
    # the macos-26-intel runner used for the legacy regression tests.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select latest installed Xcode
        run: |
          python3 - <<'PYCODE'
          import glob, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              developer = app + '/Contents/Developer'
              result = subprocess.run(['env', 'DEVELOPER_DIR=' + developer, 'xcodebuild', '-version'], capture_output=True, text=True)
              if result.returncode == 0:
                  version = tuple(int(x) for x in result.stdout.splitlines()[0].split()[1].split('.'))
                  candidates.append((version, developer))
          version, developer = max(candidates)
          subprocess.run(['sudo', 'xcode-select', '-s', developer], check=True)
          print('Selected Xcode', version)
          PYCODE
      - name: Verify iOS 27 NowPlaying SDK
        run: |
          xcodebuild -version
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          printf 'import NowPlaying\n' | xcrun swiftc -sdk "$SDK_PATH" -target arm64-apple-ios27.0 -typecheck -
      - name: Verify pause, scrolling and progress isolation before packaging
        run: |
          NIGHTWELL_EQ_CHECK="$RUNNER_TEMP/nightwell-eq-pause"
          mkdir -p "$NIGHTWELL_EQ_CHECK/Sources" "$NIGHTWELL_EQ_CHECK/Tests"
          cp NightwellMusic/NativeEQPlayback.swift "$NIGHTWELL_EQ_CHECK/Sources/"
          cp NightwellMusic/LibrarySessionState.swift NightwellMusic/LibraryNavigationSession.swift NightwellMusic/PlaybackProgressPresentation.swift NightwellMusic/TrackSwipeInteraction.swift "$NIGHTWELL_EQ_CHECK/Sources/"
          cp NativeTests/NativeEQPlaybackTests.swift "$NIGHTWELL_EQ_CHECK/Tests/"
          cp NativeTests/LibraryNavigationSessionTests.swift NativeTests/PlaybackProgressPresentationTests.swift NativeTests/TrackSwipeInteractionTests.swift "$NIGHTWELL_EQ_CHECK/Tests/"
          cat > "$NIGHTWELL_EQ_CHECK/Package.swift" <<'SWIFT'
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(name: "NightwellEQPause", platforms: [.macOS(.v13)], targets: [
              .target(name: "NightwellMusic", path: "Sources"),
              .testTarget(name: "NightwellMusicTests", dependencies: ["NightwellMusic"], path: "Tests")
          ])
          SWIFT
          swift test --package-path "$NIGHTWELL_EQ_CHECK" --filter 'NativeEQPlaybackTests.testPauseStopsRenderingAndResumeContinuesTheScheduledFile|LibraryNavigationSessionTests|PlaybackProgressPresentationTests|TrackSwipeInteractionTests'
      - name: Generate neutral app icon
        run: python3 scripts/make-neutral-app-icon.py --platform ios
      - name: Prepare animated Vice Nights palm layers
        run: |
          python3 -m venv .vice-venv
          .vice-venv/bin/python -m pip install --quiet numpy opencv-python-headless
          .vice-venv/bin/python scripts/prepare-vice-palms.py --platform ios
      - name: Generate project
        run: |
          sed -i '' "s/SOURCE_COMMIT/$GITHUB_SHA/" project.yml
          xcodegen generate
      - name: Build unsigned IPA
        run: |
          xcodebuild -project NightwellMusic.xcodeproj -scheme NightwellMusic -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CURRENT_PROJECT_VERSION=$((400 + GITHUB_RUN_NUMBER)) CODE_SIGNING_ALLOWED=NO build
          test -s build-device/Build/Products/Release-iphoneos/NightwellMusic.app/Assets.car
          test -s build-device/Build/Products/Release-iphoneos/NightwellMusic.app/PlugIns/NightwellWidgets.appex/NightwellWidgets
          # Never restore old compiled assets: they carry the Halloween launcher icon.
          test -s NightwellMusic/Assets.xcassets/AppIcon.appiconset/Icon.png
          mkdir -p output/Payload
          cp -R build-device/Build/Products/Release-iphoneos/NightwellMusic.app output/Payload/
          cd output
          zip -qr Nightwell-Music-recovered-unsigned.ipa Payload
      - name: Record IPA checksum and commit
        run: python3 scripts/build-provenance.py --platform ios --directory output --output output/build-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-iOS-unsigned
          path: |
            output/Nightwell-Music-recovered-unsigned.ipa
            output/build-provenance.json
      - name: Verify system pause and interface responsiveness
        run: |
          NIGHTWELL_SIMULATOR_ID="$(python3 - <<'PYCODE'
          import json, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          phones = [device for runtime, group in devices['devices'].items() if 'iOS-27-' in runtime for device in group if 'iPhone' in device['name']]
          if not phones:
              raise SystemExit('An iOS 27 iPhone simulator is required for NowPlaying tests')
          print(phones[0]['udid'])
          PYCODE
          )"
          xcodebuild -project NightwellMusic.xcodeproj -scheme NightwellMusic -configuration Debug -destination "platform=iOS Simulator,id=$NIGHTWELL_SIMULATOR_ID" -derivedDataPath build-transport -resultBundlePath transport.xcresult -only-testing:NightwellMusicTests/NowPlayingTransportTests -only-testing:NightwellMusicTests/NativeEQPlaybackTests/testPauseStopsRenderingAndResumeContinuesTheScheduledFile -only-testing:NightwellMusicTests/LibraryNavigationSessionTests -only-testing:NightwellMusicTests/PlaybackProgressPresentationTests -only-testing:NightwellMusicTests/PlaybackPresentationTests -only-testing:NightwellMusicTests/TrackSwipeInteractionTests -only-testing:NightwellMusicTests/OfflineDownloadPolicyTests -only-testing:NightwellMusicTests/DownloadLiveActivityTests -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test

  presentation-regression:
    name: Artist and search regression
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select latest installed Xcode
        run: |
          python3 - <<'PYCODE'
          import glob, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              developer = app + '/Contents/Developer'
              result = subprocess.run(['env', 'DEVELOPER_DIR=' + developer, 'xcodebuild', '-version'], capture_output=True, text=True)
              if result.returncode == 0:
                  version = tuple(int(x) for x in result.stdout.splitlines()[0].split()[1].split('.'))
                  candidates.append((version, developer))
          version, developer = max(candidates)
          subprocess.run(['sudo', 'xcode-select', '-s', developer], check=True)
          PYCODE
      - name: Generate project
        run: xcodegen generate
      - name: Open artist profile and collapse search
        run: |
          NIGHTWELL_SIMULATOR_ID="$(python3 - <<'PYCODE'
          import json, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          phones = [device for group in devices['devices'].values() for device in group if 'iPhone' in device['name']]
          print(phones[0]['udid'])
          PYCODE
          )"
          xcodebuild -project NightwellMusic.xcodeproj -scheme NightwellMusic -configuration Debug -destination "platform=iOS Simulator,id=$NIGHTWELL_SIMULATOR_ID" -derivedDataPath build-presentation -resultBundlePath artist-presentation.xcresult -only-testing:NightwellMusicTests/ArtistProfilePresentationTests -only-testing:NightwellMusicTests/SearchPresentationTests -only-testing:NightwellMusicTests/AudioStreamPrefetchTests -only-testing:NightwellMusicTests/NativeRegressionTests/testCoverRoundsAllFourCornersAsOneSurface -only-testing:NightwellMusicTests/NativeRegressionTests/testOfflineArtworkPersistsAndIsRemovedWithDownload -only-testing:NightwellMusicTests/NativeRegressionTests/testRoundedCoverCornersShowBackdropWithoutSecondaryArtworkWedges -only-testing:NightwellMusicTests/NativeRegressionTests/testOriginalArtworkPixelsRemainUntouchedInRenderedPlayer -only-testing:NightwellMusicTests/NowPlayingTransportTests/testTrackChangesDoNotCarryPreviousCoverOrLoseLateArtwork -only-testing:NightwellMusicTests/NowPlayingTransportTests/testLockScreenArtworkCacheProvidesCoverWithoutNetwork -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iOS-presentation-regression-results
          path: artist-presentation.xcresult
          if-no-files-found: ignore
