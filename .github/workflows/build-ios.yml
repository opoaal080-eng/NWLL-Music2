name: Build Nightwell Music iOS (Recovered)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NightwellMusic/**'
      - 'source/NightwellMusic/**'
      - 'NativeTests/**'
      - 'project.yml'
      - 'scripts/verify-native-source.py'
      - 'scripts/test-*.swift'
      - '.github/workflows/build-ios.yml'
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovered sources
        run: python3 scripts/verify-native-source.py
      - name: Verify mirrored iOS sources
        run: |
          cmp NightwellMusic/MusicStore.swift source/NightwellMusic/MusicStore.swift
      - name: Parse Swift sources
        run: |
          swiftc -frontend -parse NightwellMusic/*.swift NativeTests/*.swift
          swiftc -frontend -parse source/NightwellMusic/*.swift
      - name: Test Premium payment confirmation
        run: |
          swiftc NightwellMusic/PremiumPaymentPolicy.swift scripts/test-premium-payment.swift -o /tmp/test-premium-payment
          /tmp/test-premium-payment
      - name: Test progressive library loading
        run: |
          swiftc NightwellMusic/LibraryRefreshCoordinator.swift scripts/test-library-refresh.swift -o /tmp/test-library-refresh
          /tmp/test-library-refresh
      - name: Test aura preparation
        run: |
          swiftc NightwellMusic/AuraPreparationPolicy.swift scripts/test-aura-preparation.swift -o /tmp/test-aura-preparation
          /tmp/test-aura-preparation
      - name: Test request retry safety
        run: |
          swiftc NightwellMusic/RequestRetry.swift scripts/test-request-retry.swift -o /tmp/test-request-retry
          /tmp/test-request-retry
      - name: Test playlist parsing on device
        run: |
          swiftc NightwellMusic/TransferPreparation.swift scripts/test-transfer-preparation.swift -o /tmp/test-transfer-preparation
          /tmp/test-transfer-preparation
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select latest installed Xcode
        run: |
          python3 - <<'PYCODE'
          import glob, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              developer = app + '/Contents/Developer'
              result = subprocess.run(['env', 'DEVELOPER_DIR=' + developer, 'xcodebuild', '-version'], capture_output=True, text=True)
              if result.returncode == 0:
                  version = tuple(int(x) for x in result.stdout.splitlines()[0].split()[1].split('.'))
                  candidates.append((version, developer))
          version, developer = max(candidates)
          subprocess.run(['sudo', 'xcode-select', '-s', developer], check=True)
          print('Selected Xcode', version)
          PYCODE
      - name: Generate project
        run: |
          sed -i '' "s/SOURCE_COMMIT/$GITHUB_SHA/" project.yml
          xcodegen generate
      - name: Build unsigned IPA
        run: |
          xcodebuild -project NightwellMusic.xcodeproj -scheme NightwellMusic -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CURRENT_PROJECT_VERSION=$((400 + GITHUB_RUN_NUMBER)) CODE_SIGNING_ALLOWED=NO build
          python3 ios/apply_legacy_assets.py build-device/Build/Products/Release-iphoneos/NightwellMusic.app
          test $(stat -f%z build-device/Build/Products/Release-iphoneos/NightwellMusic.app/Assets.car) -gt 5000000
          mkdir -p output/Payload
          cp -R build-device/Build/Products/Release-iphoneos/NightwellMusic.app output/Payload/
          cd output
          zip -qr Nightwell-Music-recovered-unsigned.ipa Payload
      - name: Record IPA checksum and commit
        run: python3 scripts/build-provenance.py --platform ios --directory output --output output/build-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-iOS-unsigned
          path: |
            output/Nightwell-Music-recovered-unsigned.ipa
            output/build-provenance.json

      - name: Build simulator and capture reference screens
        # Simulator screenshots are diagnostic; a CoreSimulator failure must not
        # invalidate an already built and uploaded device IPA.
        continue-on-error: true
        run: |
          xcodebuild -project NightwellMusic.xcodeproj -scheme NightwellMusic -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-simulator CURRENT_PROJECT_VERSION=$((400 + GITHUB_RUN_NUMBER)) CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1 || { tail -100 simulator-build.log; exit 1; }
          APP=build-simulator/Build/Products/Debug-iphonesimulator/NightwellMusic.app
          python3 ios/apply_legacy_assets.py "$APP"
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and ".iOS-" in x["identifier"]]; print(max(r,key=lambda x:tuple(map(int,x["version"].split("."))))["identifier"])')
          echo "Reference runtime: $RUNTIME"
          DEVICE=$(xcrun simctl create "Nightwell iPhone 16 Reference" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '05:03' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 70
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p output/screenshots
          for SCREEN in home settings wave-settings support premium statistics; do
            xcrun simctl terminate "$DEVICE" fun.nightwell.music || true
            xcrun simctl launch "$DEVICE" fun.nightwell.music --native-smoke "--native-smoke-$SCREEN" -AppleLanguages '(ru)' -AppleLocale ru_RU
            sleep 4
            xcrun simctl io "$DEVICE" screenshot "output/screenshots/$SCREEN.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nightwell-iPhone-reference-screens
          path: |
            output/screenshots
            simulator-build.log


