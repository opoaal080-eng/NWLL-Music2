name: Test Nightwell artist catalog
on:
  push:
    paths:
      - 'server-updates/artist-catalog/**'
      - '.github/workflows/test-artist-catalog.yml'
  pull_request:
    paths:
      - 'server-updates/artist-catalog/**'
      - '.github/workflows/test-artist-catalog.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi httpx
      - name: Compile catalog module
        run: python -m py_compile server-updates/artist-catalog/artist_catalog.py
      - name: Run unit tests
        run: python -m unittest discover -s server-updates/artist-catalog -p 'test_*.py' -v
      - name: Package Windows server update
        run: |
          cd server-updates/artist-catalog
          zip -9 -j ../../Nightwell-Artist-Catalog-Server.zip artist_catalog.py install_artist_catalog.py Install_Artist_Catalog.bat README-RU.md
      - name: Upload Windows server package
        uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Artist-Catalog-Server
          path: Nightwell-Artist-Catalog-Server.zip
          retention-days: 14
