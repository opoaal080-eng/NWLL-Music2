name: Test account devices and family access
on:
  pull_request:
    paths:
      - 'server-updates/account-access/**'
      - '.github/workflows/test-account-access.yml'
  push:
    branches: [main]
    paths:
      - 'server-updates/account-access/**'
      - '.github/workflows/test-account-access.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated test dependencies
        run: python -m pip install -r server-updates/account-access/requirements-test.txt
      - name: Test device quota, families and installer
        run: python -m unittest discover -s server-updates/account-access -p "test_*.py" -v
      - name: Validate Python sources
        run: python -m compileall -q server-updates/account-access
      - name: Build module ZIP without runtime data
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('server-updates/account-access')
          with ZipFile('Nightwell-Account-Access-Family.zip', 'w', ZIP_DEFLATED) as archive:
              for path in sorted(root.iterdir()):
                  if path.is_file() and path.suffix in {'.py', '.html', '.md', '.bat', '.txt'}:
                      archive.write(path, 'account-access/' + path.name)
          PY
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: Nightwell-Account-Access-Family
          path: Nightwell-Account-Access-Family.zip
          if-no-files-found: error
