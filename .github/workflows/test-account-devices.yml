name: Test Nightwell account devices

on:
  push:
    branches:
      - feature/account-devices-2-free-5-premium-20261114
    paths:
      - 'server-updates/account-devices/**'
      - '.github/workflows/test-account-devices.yml'
  workflow_dispatch:

jobs:
  test-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check account device deployment safety
        run: python -m unittest discover -s server-updates/account-devices -p 'test_*.py' -v
